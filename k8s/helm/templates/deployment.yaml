apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "users-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        {{- include "users-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: application
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/bin/main
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          env:
            - name: USERS_POSTGRES_DB_HOST
              value: "{{ .Values.db.host }}"
            - name: USERS_POSTGRES_DB_PORT_INNER
              value: "{{ .Values.db.port }}"
            - name: USERS_POSTGRES_DB_SSLMODE
              value: {{ .Values.db.sslMode | quote }}
            - name: USERS_POSTGRES_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_USER
            - name: USERS_POSTGRES_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_PASSWORD
            - name: USERS_POSTGRES_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_DB
            - name: RUN_MODE
              value: "k8s"
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - PGPASSWORD="$USERS_POSTGRES_DB_PASS" PGSSLMODE="$USERS_POSTGRES_DB_SSLMODE" psql -h "$USERS_POSTGRES_DB_HOST" -p "$USERS_POSTGRES_DB_PORT_INNER" -U "$USERS_POSTGRES_DB_USER" -d "$USERS_POSTGRES_DB_NAME" -v ON_ERROR_STOP=1 -c "SELECT 1;" >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
