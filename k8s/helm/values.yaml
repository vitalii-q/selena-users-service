replicaCount: 1

image:
  repository: selena-users-service
  tag: amd64
  pullPolicy: Never

service:
  type: ClusterIP
  port: 9065

app:
  env: "development"
  port: "9065"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

db:
  host: "host.minikube.internal"
  port: 9265
  sslMode: "disable"
  secretName: "users-db-secret"

runMode: "k8s"
