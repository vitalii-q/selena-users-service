replicaCount: 1

image:
  repository: selena-users-service
  tag: amd64
  pullPolicy: Never

service:
  type: ClusterIP
  port: 9065

ingress:
  enabled: false
  hosts:
    - host: users.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

app:
  env: "development"
  port: "9065"
  projectSuffix: "local"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

persistence:
  enabled: false
  size: 1Gi
  storageClass: standard

db:
  host: "host.minikube.internal"
  port: 9265
  sslMode: "disable"
  secretName: "users-db-secret"

runMode: "k8s"
