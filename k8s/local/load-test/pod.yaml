apiVersion: v1
kind: Pod
metadata:
  name: users-service-load-test
  namespace: selena-dev
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/component: load-test
spec:
  restartPolicy: Never
  containers:
    - name: load-test
      image: python:3.13.18-alpine3.24
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - /scripts/loadtest.py
      args:
        - --url
        - http://users-service.selena-dev.svc.cluster.local:9065/api/v1/users
        - --requests
        - "200"
        - --concurrency
        - "10"
      volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
  volumes:
    - name: script
      configMap:
        name: users-service-load-test-script
