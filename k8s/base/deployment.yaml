apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: selena-dev
  labels:
    app.kubernetes.io/name: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: users-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-service
    spec:
      containers:
        - name: users-service
          image: selena-users-service:amd64
          imagePullPolicy: Never
          command:
            - /app/bin/main
          ports:
            - containerPort: 9065
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: USERS_POSTGRES_DB_USER
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_USER
            - name: USERS_POSTGRES_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_PASSWORD
            - name: USERS_POSTGRES_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_DB
            - name: RUN_MODE
              value: "k8s"
          envFrom:
            - configMapRef:
                name: users-config
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - PGPASSWORD="$USERS_POSTGRES_DB_PASS" PGSSLMODE="$USERS_POSTGRES_DB_SSLMODE" psql -h "$USERS_POSTGRES_DB_HOST" -p "$USERS_POSTGRES_DB_PORT_INNER" -U "$USERS_POSTGRES_DB_USER" -d "$USERS_POSTGRES_DB_NAME" -v ON_ERROR_STOP=1 -c "SELECT 1;" >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
